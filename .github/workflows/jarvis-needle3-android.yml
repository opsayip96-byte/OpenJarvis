name: JARVIS Needle 3 Android

on:
  push:
    branches:
      - jarvis-android-build
    paths:
      - '.github/workflows/jarvis-needle3-android.yml'
      - 'frontend/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarvis-needle3-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout OpenJarvis
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Match repository npm version
        run: npm install --global npm@11.19.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3

      - name: Install Android build packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Download the matching Cactus Android engine and Needle 3 weights
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cactus-compute==4.2.6"
          cactus download android-arm64 --model needle3 --out "$RUNNER_TEMP/cactus-bundle"
          ENGINE_DIR="$RUNNER_TEMP/cactus-bundle/android-arm64"
          test -s "$ENGINE_DIR/libcactus.a"
          test -s "$ENGINE_DIR/cactus.h"
          test -s "$ENGINE_DIR/needle3.cact"
          mkdir -p frontend/android/app/src/main/cpp/prebuilt/arm64-v8a
          cp "$ENGINE_DIR/libcactus.a" frontend/android/app/src/main/cpp/prebuilt/arm64-v8a/libcactus.a
          cp "$ENGINE_DIR/cactus.h" frontend/android/app/src/main/cpp/include/cactus.h
          mkdir -p artifacts
          cp "$ENGINE_DIR/needle3.cact" artifacts/needle3.cact
          echo "Needle model bytes: $(wc -c < artifacts/needle3.cact)"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web frontend and sync Capacitor
        working-directory: frontend
        run: |
          npm run build:android
          npx cap sync android

      - name: Build JARVIS Android ARM64 APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: |
          mkdir -p artifacts
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk artifacts/JARVIS-Needle3-Android-arm64-debug.apk
          ls -lh artifacts

      - name: Upload APK and offline Needle 3 model
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Needle3-Android-arm64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
