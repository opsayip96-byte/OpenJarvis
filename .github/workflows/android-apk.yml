name: Build JARVIS Android APK
# Build standalone APK with the native JARVIS-Nano CPU inference engine.

on:
  workflow_dispatch:
  push:
    branches:
      - jarvis-autonomous-control
    paths:
      - "frontend/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"

      - name: Pin npm
        run: npm install --global npm@11.19.0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install native build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'ndk;27.2.12479018' 'cmake;3.22.1'

      - name: Fetch llama.cpp source
        run: git clone https://github.com/ggml-org/llama.cpp frontend/android/app/src/main/cpp/llama.cpp
          git -C frontend/android/app/src/main/cpp/llama.cpp checkout afe77e18fadc2e673c6a6299495a443e17378ce4

      - name: Build web assets
        working-directory: frontend
        run: npm run build:android

      - name: Sync Capacitor Android project
        working-directory: frontend
        run: npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-android-debug
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
