name: Android APK

on:
  push:
    branches: [main, "codex/**", "jarvis-android-build"]
    paths:
      - "frontend/**"
      - "src/openjarvis/**"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "src/openjarvis/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build JARVIS debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Use the repository's pinned npm version
        run: npm install --global npm@11.19.0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: frontend/android/**/*.gradle*

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform, build tools, and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Python for Cactus engine
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Needle 3 Android native engine and model
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cactus-compute==4.2.6"
          cactus download android-arm64 --model needle3 --out "$RUNNER_TEMP/cactus-bundle"
          ENGINE_DIR="$RUNNER_TEMP/cactus-bundle/android-arm64"
          test -s "$ENGINE_DIR/libcactus.a"
          test -s "$ENGINE_DIR/cactus.h"
          test -s "$ENGINE_DIR/needle3.cact"
          echo "c9d915eca282ed42d1a09b143b592adb4cc6744ffe2d294adf5cfc5548170c38  $ENGINE_DIR/needle3.cact" | sha256sum --check
          mkdir -p frontend/android/app/src/main/cpp/prebuilt/arm64-v8a
          mkdir -p frontend/android/app/src/main/cpp/include
          cp "$ENGINE_DIR/libcactus.a" frontend/android/app/src/main/cpp/prebuilt/arm64-v8a/libcactus.a
          cp "$ENGINE_DIR/cactus.h" frontend/android/app/src/main/cpp/include/cactus.h
          mkdir -p artifacts
          cp "$ENGINE_DIR/needle3.cact" artifacts/needle3.cact

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend and sync native Android project
        working-directory: frontend
        run: |
          npm run build:android
          npx cap sync android

      - name: Build debug APK
        working-directory: frontend/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Collect and verify APK
        run: |
          test -s frontend/android/app/build/outputs/apk/debug/app-debug.apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk artifacts/JARVIS-Needle3-Android-arm64-debug.apk
          ls -lh artifacts

      - name: Upload APK and offline Needle 3 model
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Needle3-Android-arm64
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
